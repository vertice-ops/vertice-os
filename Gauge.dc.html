<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: 'Geist', sans-serif; color: #ffffff; width: 100%;">
  <svg viewBox="0 0 280 170" style="width: 100%; max-width: 320px; display: block;">
    <path d="M20 150 A120 120 0 0 1 260 150" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="18" stroke-linecap="round"></path>
    <path d="M20 150 A120 120 0 0 1 260 150" fill="none" stroke="{{ color }}" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{ dash }}" style="transition: stroke-dasharray 0.4s ease, stroke 0.3s ease;"></path>
    <line x1="123.1" y1="43.3" x2="119.4" y2="19.6" stroke="#64748b" stroke-width="2"></line>
    <line x1="203.5" y1="62.6" x2="217.6" y2="43.2" stroke="#64748b" stroke-width="2"></line>
    <text x="140" y="128" text-anchor="middle" font-family="'Geist', sans-serif" font-size="54" font-weight="600" fill="#ffffff">{{ valueLabel }}</text>
    <text x="140" y="152" text-anchor="middle" font-family="Geist Mono, monospace" font-size="12" fill="#94a3b8">de 100</text>
    <text x="20" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="11" fill="#64748b">0</text>
    <text x="260" y="168" text-anchor="middle" font-family="Geist Mono, monospace" font-size="11" fill="#64748b">100</text>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:200},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:72,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#34d399&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = Math.max(0, Math.min(100, Number(this.props.value ?? 72)));
    const color = this.props.color ?? (v >= 70 ? '#34d399' : v >= 45 ? '#fbbf24' : '#f87171');
    const len = Math.PI * 120;
    return { valueLabel: String(Math.round(v)), color, dash: (len * v / 100).toFixed(1) + ' 400' };
  }
}
</script>
</body>
</html>
