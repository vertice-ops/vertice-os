@keyframes vxGlow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes vxOut { from { opacity: 1; transform: scale(1); filter: blur(0); } to { opacity: 0; transform: scale(1.05); filter: blur(10px); } }

  }
  reveal() { document.documentElement.classList.add('vx-ready'); }
  componentDidMount() {
    if (this.skipIntro) { this.reveal(); return this.finish(true); }

    this.t2 = setTimeout(() => this.finish(), TOTAL);
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); this.reveal(); }
  leave() { this.reveal(); this.setState({ leaving: true }); }
  finish(silent) { clearTimeout(this.t1); clearTimeout(this.t2); this.reveal(); if (!silent || this.state.show) this.setState({ show: false }); this.props.onDone && this.props.onDone(); }
